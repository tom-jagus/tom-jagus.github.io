<header class="site-header">
  <div class="container header-inner">
    <a class="home-link" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Params.name }}, home">
      <img class="wordmark" src="{{ site.Params.wordmark | relURL }}" alt="{{ site.Params.name }}" width="229" height="64">
    </a>
    <nav class="site-nav" aria-label="Main navigation">{{ partial "navigation-links.html" . }}</nav>
    <button class="menu-toggle" type="button" aria-label="Open navigation" aria-controls="mobile-menu" aria-expanded="false" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>
</header>
<dialog class="mobile-menu" id="mobile-menu" aria-labelledby="menu-title">
  <div class="container">
    <div class="menu-top">
      <h2 class="sr-only" id="menu-title">Navigation</h2>
      <button class="menu-close" type="button" aria-label="Close navigation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
      </button>
    </div>
    <nav class="mobile-links" aria-label="Mobile navigation">{{ partial "navigation-links.html" . }}</nav>
  </div>
</dialog>
