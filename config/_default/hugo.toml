baseURL = "https://tom.jagus.me/"
title = "Tom Jagus"
defaultContentLanguage = "en"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
disableKinds = ["taxonomy", "term"]
# Generated output and resource caches stay local, never committed.
publishDir = "build/public"
resourceDir = "build/resources"
# Publish the site's self-contained brand assets and licensed fonts.
staticDir = ["static/site"]

[build.cleanDestinationDir]
  enable = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  page = ["HTML"]
