name: Build and deploy Hugo site

on:
  push:
    branches: ["main", "feat/website-rewrite"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hugo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.167.0"
      HUGO_ARCHIVE_SHA256: "0163f5c3deddac1f494a1629ddc40c65d18de9d5794facd98f7f96ac2c7d8957"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Hugo Extended
        run: |
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --location --retry 3 \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          printf '%s  %s\n' "${HUGO_ARCHIVE_SHA256}" "${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/hugo-bin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/hugo-bin" hugo
          echo "${RUNNER_TEMP}/hugo-bin" >> "${GITHUB_PATH}"

      - name: Check Hugo version and edition
        run: |
          version="$(hugo version)"
          echo "${version}"
          [[ "${version}" == "hugo v${HUGO_VERSION}-"*"+extended linux/amd64 "* ]]
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tools = tomllib.loads(Path("mise.toml").read_text())["tools"]
          assert tools["hugo-extended"] == os.environ["HUGO_VERSION"], "Local and CI Hugo pins differ"
          PY

      - name: Build production content
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo-cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --noBuildLock \
            --panicOnWarning \
            --buildDrafts=false \
            --buildFuture=false \
            --buildExpired=false \
            --baseURL "https://tom.jagus.me/" \
            --destination "${RUNNER_TEMP}/hugo-public"

      - name: Upload review artifact
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hugo-review-${{ github.sha }}
          path: ${{ runner.temp }}/hugo-public
          if-no-files-found: error
          retention-days: 7

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/hugo-public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
